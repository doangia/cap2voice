[package]
name = "cap2voice-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Windows desktop subtitle OCR, translation, and Vietnamese TTS overlay"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
wcocr-rs = { path = "../wcocr-rs" }
xcap = "0.9.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry"] }
