[package]
name = "cap2voice-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Windows desktop subtitle OCR, translation, and Vietnamese TTS overlay"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-mp3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
wcocr-rs = { path = "../wcocr-rs" }
xcap = "0.9.10"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
